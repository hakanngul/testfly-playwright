<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TestFly Report</title>
<style>
:root{
  --bg:#f6f7f9;--panel:#fff;--text:#1b1f24;--muted:#667085;--border:#e1e4e8;
  --pass:#1a7f4b;--fail:#c62828;--warn:#b26a00;--info:#1f5fbf;--skip:#8a94a3;--accent:#4f46e5;
  --pass-bg:#e4f5ec;--fail-bg:#fdeaea;--warn-bg:#fff3dc;--info-bg:#e6effc;--skip-bg:#eceff3;
  --code:#f0f2f5;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1318;--panel:#171c23;--text:#e6e9ee;--muted:#98a2b3;--border:#2a323d;
    --pass:#4cc38a;--fail:#ff7b72;--warn:#e3b341;--info:#79b0ff;--skip:#8a94a3;--accent:#8b8cf8;
    --pass-bg:#12301f;--fail-bg:#3a1a1a;--warn-bg:#38290a;--info-bg:#14264a;--skip-bg:#222a34;
    --code:#10151b;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1318;--panel:#171c23;--text:#e6e9ee;--muted:#98a2b3;--border:#2a323d;
  --pass:#4cc38a;--fail:#ff7b72;--warn:#e3b341;--info:#79b0ff;--skip:#8a94a3;--accent:#8b8cf8;
  --pass-bg:#12301f;--fail-bg:#3a1a1a;--warn-bg:#38290a;--info-bg:#14264a;--skip-bg:#222a34;
  --code:#10151b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.muted{color:var(--muted)}
.top{display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.brand{font-weight:700;font-size:16px}
nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
nav button{background:none;border:0;color:var(--muted);padding:6px 12px;border-radius:6px;cursor:pointer;font:inherit}
nav button[aria-selected="true"]{background:var(--accent);color:#fff}
button.ghost,.btn{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 10px;cursor:pointer;font:inherit}
.btn:hover,button.ghost:hover{border-color:var(--accent)}
main{max-width:1200px;margin:0 auto;padding:20px}
.view[hidden]{display:none}
.grid{display:grid;gap:16px}
.cols-2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.card h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.stat .n{font-size:26px;font-weight:700}
.stat .l{color:var(--muted);font-size:12px}
.pass{color:var(--pass)}.fail{color:var(--fail)}.warn{color:var(--warn)}.info{color:var(--info)}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600;margin-right:4px;white-space:nowrap}
.b-passed,.b-STABLE{background:var(--pass-bg);color:var(--pass)}
.b-failed,.b-timedOut,.b-interrupted,.b-HIGH,.b-APPLICATION_BUG{background:var(--fail-bg);color:var(--fail)}
.b-flaky,.b-WATCH,.b-SYSTEM_FLAKY{background:var(--warn-bg);color:var(--warn)}
.b-healed,.b-TEST_BUG{background:var(--info-bg);color:var(--info)}
.b-skipped,.b-quarantined,.b-NEEDS_INVESTIGATION{background:var(--skip-bg);color:var(--skip)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
input[type=search],select{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 9px;font:inherit}
input[type=search]{min-width:240px}
.row{background:var(--panel);border:1px solid var(--border);border-radius:8px;margin-bottom:6px}
.row>.head{display:flex;gap:10px;align-items:center;padding:8px 12px;cursor:pointer;flex-wrap:wrap}
.row>.head:hover{background:var(--code)}
.row .title{flex:1;min-width:200px;font-weight:600}
.row .file{color:var(--muted);font-size:12px}
.detail{padding:4px 14px 14px;border-top:1px solid var(--border)}
.detail h4{margin:14px 0 6px;font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:.04em}
pre{background:var(--code);border-radius:6px;padding:10px;overflow:auto;max-height:320px;margin:0;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:70px 14px 1fr;gap:8px;align-items:center;padding:2px 0}
.tl .dot{width:10px;height:10px;border-radius:50%;background:var(--info)}
.tl .l-pass{background:var(--pass)}.tl .l-fail{background:var(--fail)}.tl .l-warn{background:var(--warn)}
.bar{height:8px;border-radius:4px;background:var(--accent);min-width:2px}
.bar-track{background:var(--code);border-radius:4px;height:8px;width:100%}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;word-break:break-all}
a{color:var(--accent)}
code{background:var(--code);padding:1px 5px;border-radius:4px;font-size:12px}
.empty{padding:24px;text-align:center;color:var(--muted)}
svg text{fill:var(--muted);font-size:10px}
@media (max-width:640px){main{padding:12px}.top{padding:8px 12px}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">TestFly <span class="muted">report</span></div>
  <nav id="tabs" role="tablist">
    <button role="tab" data-tab="overview">Overview</button>
    <button role="tab" data-tab="tests">Tests</button>
    <button role="tab" data-tab="radar">Flakiness Radar</button>
    <button role="tab" data-tab="history">History</button>
    <button role="tab" data-tab="heals">Heals</button>
  </nav>
  <button id="theme" class="ghost" title="Toggle light/dark theme" aria-label="Toggle theme">Theme</button>
</header>
<main>
  <section id="view-overview" class="view" role="tabpanel"></section>
  <section id="view-tests" class="view" role="tabpanel" hidden></section>
  <section id="view-radar" class="view" role="tabpanel" hidden></section>
  <section id="view-history" class="view" role="tabpanel" hidden></section>
  <section id="view-heals" class="view" role="tabpanel" hidden></section>
</main>

  function stat(n, label, cls) {

  function renderOverview() {

  function quarantineSpec(id) {
    var i = id.indexOf('::'), j = id.indexOf('::', i + 2);
    var file = id.slice(i + 2, j), title = id.slice(j + 2);
    return file + (title ? ' › ' + title : '');
  }
  function renderRadar() {
    var el = clear(document.getElementById('view-radar'));
    var f = D.flakiness;
    var counts = { HIGH: 0, WATCH: 0, STABLE: 0 };
    f.forEach(function (x) { counts[x.risk]++; });
    el.appendChild(h('div', { class: 'cards', style: 'margin-bottom:16px' }, [
      stat(counts.HIGH, 'HIGH (>= 33%)', counts.HIGH ? 'fail' : ''), stat(counts.WATCH, 'WATCH (10-33%)', counts.WATCH ? 'warn' : ''), stat(counts.STABLE, 'STABLE (< 10%)', 'pass')
    ]));
    var high = f.filter(function (x) { return x.risk === 'HIGH'; });
    if (high.length) {
      var yaml = 'quarantine:\n' + high.map(function (x) { return '  - "' + quarantineSpec(x.id).replace(/"/g, '\\"') + '"'; }).join('\n') + '\n';
      var btn = h('button', { class: 'btn', text: 'Copy YAML', onclick: function () { copy(yaml, btn); } });
      el.appendChild(h('div', { class: 'card', style: 'margin-bottom:16px' }, [
        h('h3', { text: 'Recommendation: quarantine ' + high.length + ' HIGH-risk test(s)' }),
        h('p', { class: 'muted', text: 'Add to testfly-quarantine.yml to keep them out of the quality gate while you fix them.' }),
        h('pre', { text: yaml }), h('div', { style: 'margin-top:8px' }, btn)
      ]));
    }
    if (!f.length) { el.appendChild(empty('No history yet.')); return; }
    var tb = h('table', {}, h('thead', {}, h('tr', {}, [['Risk', ''], ['Test', ''], ['Runs', 'num'], ['Failed', 'num'], ['Flaky', 'num'], ['Rate', ''], ['Avg time', 'num']].map(function (c) { return h('th', { class: c[1], text: c[0] }); }))));
    var body = h('tbody');
    f.forEach(function (x) {
      body.appendChild(h('tr', {}, [
        h('td', {}, badge(x.risk)), h('td', {}, [h('div', { text: x.title }), h('div', { class: 'muted', text: x.id.split('::').slice(0, 2).join(' / ') })]),
        h('td', { class: 'num', text: String(x.runs) }), h('td', { class: 'num', text: String(x.failures) }), h('td', { class: 'num', text: String(x.flakyRuns) }),
        h('td', { style: 'min-width:110px' }, [pct(x.failureRate), h('div', { class: 'bar-track' }, h('div', { class: 'bar', style: 'width:' + (x.failureRate * 100) + '%;background:' + (x.risk === 'HIGH' ? 'var(--fail)' : x.risk === 'WATCH' ? 'var(--warn)' : 'var(--pass)') }))]),
        h('td', { class: 'num', text: fmtMs(x.avgDurationMs) })
      ]));
    });
    tb.appendChild(body);
    el.appendChild(h('div', { class: 'card' }, tb));
  }

  // ---------- History ----------
  function renderHistory() {
    var el = clear(document.getElementById('view-history'));
    var H = D.history;
    var W = 720, Ht = 160, pad = 24, n = H.length, bw = Math.max(4, Math.min(40, (W - pad * 2) / n - 4));
    var svg = s('svg', { viewBox: '0 0 ' + W + ' ' + Ht, width: '100%', role: 'img', 'aria-label': 'Pass rate per run' });
    [0, 50, 100].forEach(function (g) {
      var y = Ht - pad - (Ht - pad * 2) * g / 100;
      svg.appendChild(s('line', { x1: pad, x2: W - pad, y1: y, y2: y, stroke: 'var(--border)' }));
      svg.appendChild(s('text', { x: 2, y: y + 3 }, g + '%'));
    });
    H.forEach(function (p, i) {
      var x = pad + (n === 1 ? (W - pad * 2) / 2 - bw / 2 : i * ((W - pad * 2 - bw) / (n - 1)));
      var bh = Math.max(2, (Ht - pad * 2) * p.passRate / 100);
      var rect = s('rect', { x: x, y: Ht - pad - bh, width: bw, height: bh, rx: 2, fill: p.status === 'passed' ? 'var(--pass)' : 'var(--fail)' },
        s('title', {}, fmtDate(p.startedAt) + ' - ' + p.passRate + '% (' + p.totals.failed + ' failed, ' + p.totals.flaky + ' flaky)'));
      svg.appendChild(rect);
    });
    var maxD = Math.max.apply(null, H.map(function (p) { return p.durationMs; }).concat([1]));
    var pts = H.map(function (p, i) {
      return (pad + (n === 1 ? (W - pad * 2) / 2 : i * ((W - pad * 2) / (n - 1)))) + ',' + (Ht - pad - (Ht - pad * 2) * p.durationMs / maxD);
    }).join(' ');
    svg.appendChild(s('polyline', { points: pts, fill: 'none', stroke: 'var(--accent)', 'stroke-width': 2 }));
    el.appendChild(h('div', { class: 'card' }, [h('h3', { text: 'Pass rate per run (bars) and duration (line, max ' + fmtMs(maxD) + ')' }), svg]));
    var tb = h('table', {}, h('thead', {}, h('tr', {}, ['Started', 'Status', 'Pass rate', 'Passed', 'Failed', 'Flaky', 'Healed', 'Duration', 'Branch'].map(function (c) { return h('th', { text: c }); }))));
    var body = h('tbody');
    H.slice().reverse().forEach(function (p) {
      body.appendChild(h('tr', {}, [h('td', { text: fmtDate(p.startedAt) + (p.shard ? ' (shard ' + p.shard + ')' : '') }), h('td', {}, badge(p.status, p.status === 'passed' ? 'passed' : 'failed')),
        h('td', { text: p.passRate + '%' }), h('td', { text: String(p.totals.passed) }), h('td', { text: String(p.totals.failed) }), h('td', { text: String(p.totals.flaky) }),
        h('td', { text: String(p.totals.healed) }), h('td', { text: fmtMs(p.durationMs) }), h('td', { text: p.branch || '' })]));
    });
    tb.appendChild(body);
    el.appendChild(h('div', { class: 'card', style: 'margin-top:16px;overflow:auto' }, tb));
  }

  // ---------- Heals ----------
  function renderHeals() {
    var el = clear(document.getElementById('view-heals'));
    if (!D.heals.length) { el.appendChild(empty('No locators were healed in the recorded runs.')); return; }
    el.appendChild(h('p', { class: 'muted', text: 'Every heal is a brittle locator. Update the YAML locator definition so the test no longer depends on healing.' }));
    var tb = h('table', {}, h('thead', {}, h('tr', {}, ['Locator key', 'Original', 'Healed to', 'Strategy', 'Confidence', 'Times', 'Last seen', 'Used by'].map(function (c) { return h('th', { text: c }); }))));
    var body = h('tbody');
    D.heals.forEach(function (x) {
      body.appendChild(h('tr', {}, [h('td', {}, h('code', { text: x.key })), h('td', { style: 'word-break:break-all', text: x.original }), h('td', { style: 'word-break:break-all', text: x.healed }),
        h('td', { text: x.strategy }), h('td', { text: pct(x.avgConfidence) }), h('td', { text: String(x.count) }), h('td', { text: fmtDate(x.lastSeen) }), h('td', { text: x.tests.join(', ') })]));
    });
    tb.appendChild(body);
    el.appendChild(h('div', { class: 'card', style: 'overflow:auto' }, tb));
  }

  renderOverview(); renderTests(); renderRadar(); renderHistory(); renderHeals();
  showTab((location.hash || '').slice(1));
})();
</script>
</body>
